<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Product Listing Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <h1>Product Listing Dashboard</h1>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search products..." />

        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <option value="electronics">Electronics</option>
            <option value="jewelery">Jewelery</option>
            <option value="men's clothing">Men's Clothing</option>
            <option value="women's clothing">Women's Clothing</option>
        </select>

        <button onclick="sortProducts('low')">Sort Low → High</button>
        <button onclick="sortProducts('high')">Sort High → Low</button>
    </div>

    <p id="loader">Loading...</p>
    <p id="error"></p>

    <div id="productContainer" class="product-grid"></div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="closeBtn">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
